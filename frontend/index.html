<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="same-origin">
  <title>Home Security</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="alarm-banner" class="alarm-banner" hidden></div>
  <header class="topbar" id="topbar" hidden>
    <a class="brand" href="#/live" aria-label="Home Security – live view">
      <span class="brand-mark" id="brand-mark"></span>
      <span class="brand-name">Home Security</span>
    </a>
    <a class="alarm-pill" id="alarm-pill" href="#/alarm" aria-live="polite"></a>
    <nav class="tabs" id="tabs" aria-label="Sections"></nav>
    <div class="topbar-tools">
      <span class="conn" id="conn" role="status"></span>
      <button class="icon-btn" id="notify-btn" type="button" hidden></button>
      <button class="icon-btn" id="theme-btn" type="button"></button>
      <button class="icon-btn" id="logout-btn" type="button"></button>
    </div>
  </header>
  <div class="demo-strip" id="demo-strip" hidden></div>
  <main id="view" class="view" tabindex="-1"></main>
  <div class="toasts" id="toasts" aria-live="assertive"></div>
  <div id="modal-root"></div>
</body>
</html>
