# Frigate 0.18 configuration for the home security dashboard.
#
# scripts/setup.sh copies this to data/frigate/config/config.yml. Edit that copy, or use
# Frigate's own UI on :8971 (it writes to the same file). This template stays as reference.
#
# {FRIGATE_*} placeholders are filled from .env (see docker-compose.yml): the NVR address
# and credentials never live in this file.
#   URL-encode special characters in NVR_RTSP_PASSWORD (e.g. @ -> %40, # -> %23).

mqtt:
  enabled: true
  host: mosquitto
  user: "{FRIGATE_MQTT_USER}"
  password: "{FRIGATE_MQTT_PASSWORD}"
  stats_interval: 15  # the dashboard's System page shows these

# --- detection (CPU-only, Intel) -------------------------------------------------------------
# OpenVINO on the CPU is much faster than Frigate's plain CPU detector. If the host has an
# Intel iGPU, pass /dev/dri through (docker-compose.yml) and set device: GPU -- that is the
# single biggest speedup available without new hardware. A Coral USB is a later swap of this
# block only (type: edgetpu, device: usb), not an architecture change.
detectors:
  ov:
    type: openvino
    device: CPU

model:
  width: 300
  height: 300
  input_tensor: nhwc
  input_pixel_format: bgr
  path: /openvino-model/ssdlite_mobilenet_v2.xml
  labelmap_path: /openvino-model/coco_91cl_bkgr.txt

# With the iGPU passed through, also decode video on it:
# ffmpeg:
#   hwaccel_args: preset-vaapi

detect:
  enabled: true
  fps: 5  # first lever to pull if the System page shows skipped frames

objects:
  track: [person, car, dog, cat]
  filters:
    person:
      min_score: 0.5
      threshold: 0.7

# --- what gets kept ----------------------------------------------------------------------------
# Recordings fill disks fast. Defaults: no 24/7 footage, 3 days of motion, alerts/detections
# (clips around tracked objects) for 30/14 days. The dashboard archives its own copy of every
# event snapshot (SNAPSHOT_RETENTION_DAYS) so the event log outlives these.
record:
  enabled: true
  continuous:
    days: 0
  motion:
    days: 3
  alerts:
    retain:
      days: 30
      mode: motion
  detections:
    retain:
      days: 14
      mode: motion

snapshots:
  enabled: true
  bounding_box: true
  retain:
    default: 30

review:
  alerts:
    labels: [person]
  detections:
    labels: [person, car, dog, cat]

# --- cameras -----------------------------------------------------------------------------------
# One go2rtc stream per NVR channel and quality. The *_sub stream (low-res) feeds detection;
# the main stream is recorded and is what the dashboard plays as live video. Run
# scripts/probe_nvr.py first: it finds the right URL pattern, and the sub stream's real
# resolution for detect.width/height below.
#
#   Hikvision-style NVRs:  rtsp://USER:PASS@NVR:554/Streaming/Channels/101   (ch 1 main)
#                          rtsp://USER:PASS@NVR:554/Streaming/Channels/102   (ch 1 sub)
#   Dahua/Amcrest-style:   rtsp://USER:PASS@NVR:554/cam/realmonitor?channel=1&subtype=0  (main)
#                          rtsp://USER:PASS@NVR:554/cam/realmonitor?channel=1&subtype=1  (sub)
#
# Browsers can't play H.265 main streams reliably; set the NVR's main streams to H.264 if
# you want the dashboard's full-quality live view (the detection view works either way).
go2rtc:
  streams:
    front_door:
      - rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@{FRIGATE_NVR_HOST}:554/Streaming/Channels/101
    front_door_sub:
      - rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@{FRIGATE_NVR_HOST}:554/Streaming/Channels/102
    driveway:
      - rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@{FRIGATE_NVR_HOST}:554/Streaming/Channels/201
    driveway_sub:
      - rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@{FRIGATE_NVR_HOST}:554/Streaming/Channels/202

cameras:
  front_door:
    ffmpeg:
      output_args:
        record: preset-record-generic-audio-copy
      inputs:
        - path: rtsp://127.0.0.1:8554/front_door
          input_args: preset-rtsp-restream
          roles: [record]
        - path: rtsp://127.0.0.1:8554/front_door_sub
          input_args: preset-rtsp-restream
          roles: [detect]
    detect:
      width: 640   # must match the sub stream's real resolution
      height: 360
    live:
      streams:
        Main: front_door      # first entry = what the dashboard's "Live video" plays
        Sub: front_door_sub
    ui:
      order: 1
    # Draw zones and masks in Frigate's UI (Settings > Masks / Zones). Highest-leverage
    # tuning there is: mask the street/sky, and give alerting zones (ALERT_ZONES in .env)
    # to the areas that matter. Example of what the UI writes:
    # zones:
    #   porch:
    #     coordinates: 0.05,0.55,0.45,0.55,0.45,0.98,0.05,0.98
    #     objects: [person]

  driveway:
    ffmpeg:
      output_args:
        record: preset-record-generic-audio-copy
      inputs:
        - path: rtsp://127.0.0.1:8554/driveway
          input_args: preset-rtsp-restream
          roles: [record]
        - path: rtsp://127.0.0.1:8554/driveway_sub
          input_args: preset-rtsp-restream
          roles: [detect]
    detect:
      width: 640
      height: 360
    live:
      streams:
        Main: driveway
        Sub: driveway_sub
    ui:
      order: 2
